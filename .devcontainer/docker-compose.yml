services:
  mongo:
    image: mongo:4.4
    container_name: "mongo"
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
    volumes:
      - ./db:/data/db
  mmorpg:
    image: itzg/minecraft-server
    container_name: "mmorpg"
    ports:
      - 25565:25565
      - 5005:5005
    environment:
      EULA: "TRUE"
      VERSION: "1.20.1"
      TYPE: "PAPER"
      MAX_MEMORY: "2G"
      WORLD: /worlds/world
      ONLINE_MODE: "FALSE"
      OPS: NEXOmega, Tabula
      OVERRIDE_OPS: "TRUE"
      JVM_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      # attach a directory relative to the directory containing this compose file
      - ./mmorpg:/data
      - ./beta_world:/worlds/world
    depends_on: [mongo]
volumes:
  mmorpg:
  beta_world: