services:
  mongo:
    image: mongo:4.4
    container_name: "mongo"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: azerty123
    volumes:
      - ./db:/data/db
  mmorpg:
    image: itzg/minecraft-server
    container_name: "mmorpg"
    ports:
      - 25565:25565
      - 5005:5005
    environment:
      EULA: "TRUE"
      VERSION: "1.17.1"
      TYPE: "SPIGOT"
      MAX_MEMORY: "2G"
      WORLD: /worlds/world
      JVM_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    volumes:
      # attach a directory relative to the directory containing this compose file
      - mmorpg:/data:Z
      - mmorpg_world:/worlds/world:Z
    depends_on: [mongo]
volumes:
  mmorpg:
  mmorpg_world: