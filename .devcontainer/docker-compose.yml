services:
  mongo:
    image: mongo
    container_name: "mongo"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: azerty123
    volumes:
      - ./db:/data/db
  mmorpg:
    image: itzg/minecraft-server
    container_name: "mmorpg"
    ports:
      - 25565:25565
    environment:
      EULA: "TRUE"
      VERSION: "1.17.1"
      TYPE: "SPIGOT"
      MAX_MEMORY: "2G"
      WORLD: /worlds/world
    volumes:
      # attach a directory relative to the directory containing this compose file
      - ./mmorpg:/data
      - ./mmorpg_world:/worlds/world
    depends_on: [mongo]