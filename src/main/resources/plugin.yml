name: Mmorpg
version: ${project.version}
main: orion.mmorpg.Mmorpg
api-version: 1.17
authors: [ NEXOmega ]
description: A MMORPG Plugin for Orion Network
libraries:
  - com.github.stefvanschie.inventoryframework:IF:0.10.0
commands:
  stats:
    permission: "stats.use"
    description: "See stats of a player or an item"
  item:
    permission: "item.use"
    description: "Give item"
  menu:
    permission: "menu.use"
    description: "Show menu"
