name: Mmorpg
version: ${project.version}
main: orion.mmorpg.Mmorpg
api-version: 1.17
authors: [ NEXOmega ]
description: A MMORPG Plugin for Orion Network
libraries:
  - com.github.stefvanschie.inventoryframework:IF:0.10.0
commands:
  data:
    permission: "orion.data.use"
    description: "See data of a player or an item"
  item:
    permission: "orion.item.use"
    description: "Give item"
  menu:
    permission: "orion.menu.use"
    description: "Show menu"
  party:
    permission: "orion.party.use"
    description: "Create party"
  admin:
    permission: "orion.admin.command"
    description: "Administrator Command"